[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/book-now/index.html"
  to = "/book-now"
  status = 301

[[redirects]]
  from = "/book-now.html"
  to = "/book-now"
  status = 301

[[redirects]]
  from = "/book-now/"
  to = "/book-now"
  status = 301

[[redirects]]
  from = "/apartmani-krapinske-toplice.html"
  to = "/apartmani-krapinske-toplice"
  status = 301

[[redirects]]
  from = "/apartmani-krapinske-toplice/"
  to = "/apartmani-krapinske-toplice"
  status = 301

[[redirects]]
  from = "/en/index.html"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/en"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/en/book-now/index.html"
  to = "/en/book-now"
  status = 301

[[redirects]]
  from = "/en/book-now.html"
  to = "/en/book-now"
  status = 301

[[redirects]]
  from = "/en/book-now/"
  to = "/en/book-now"
  status = 301

[[redirects]]
  from = "/en/apartmani-krapinske-toplice.html"
  to = "/en/apartmani-krapinske-toplice"
  status = 301

[[redirects]]
  from = "/en/apartmani-krapinske-toplice/"
  to = "/en/apartmani-krapinske-toplice"
  status = 301

[[redirects]]
  from = "/success.html"
  to = "/thank-you"
  status = 301

[[redirects]]
  from = "/success"
  to = "/thank-you"
  status = 301

[[redirects]]
  from = "/thank-you/"
  to = "/thank-you"
  status = 301

[[redirects]]
  from = "/en/thank-you/"
  to = "/en/thank-you"
  status = 301

[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.apartments-dada.com/*"
  to = "https://apartments-dada.com/:splat"
  status = 301
  force = true

[context.production.environment]
  NODE_VERSION = "20"
