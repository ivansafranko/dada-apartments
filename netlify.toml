[build]
  command = "npm run build"
  publish = "dist"

# Astro writes the booking route as `book-now/index.html`. Netlify Pretty URLs
# makes `/book-now/` its public canonical URL and safely normalizes the
# extensionless alias to that form.
[build.processing.html]
  pretty_urls = true

# Netlify requires a `to` path for custom error responses. The 410 status
# keeps this from being an HTTP redirect, while the body is not the homepage.
[[redirects]]
  from = "/apartmani-krapinske-toplice"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/apartmani-krapinske-toplice/"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/book-now.html"
  to = "/book-now/"
  status = 301
  force = true

# Redirect HTTP to HTTPS
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

# Redirect www to non-www
[[redirects]]
  from = "https://www.apartments-dada.com/*"
  to = "https://apartments-dada.com/:splat"
  status = 301
  force = true

[context.production.environment]
  NODE_VERSION = "18"

# Form handling - emails will be sent to the configured email
# You'll need to configure this in Netlify admin panel:
# Site Settings > Forms > Form notifications
# Add espana.dsr@gmail.com as the notification email
